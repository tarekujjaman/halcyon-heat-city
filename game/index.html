<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HALCYON HEAT</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./src/hud/styles.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<canvas id="game" aria-label="HALCYON HEAT: an open-world crime game in Halcyon Bay"></canvas>
<div id="hud" class="hidden">
  <div id="objective" class="hidden"><span class="tag">OBJECTIVE</span><span id="objective-text"></span></div>
  <div id="mission-timer" class="hidden"></div>
  <div id="waypoint-info" class="hidden"></div>
  <div id="hint" class="hidden"></div>
  <div id="top-right">
    <div id="money">$0</div>
    <div id="money-delta"></div>
    <div id="stars"></div>
    <div id="weapon"><span id="weapon-name">Fists</span><span id="weapon-ammo"></span></div>
    <div id="clock">17:30</div>
    <div id="district"></div>
  </div>
  <div id="notifications"></div>
  <div id="bottom-left">
    <div id="bars"><div class="bar"><div class="fill" id="bar-health"></div></div><div class="bar"><div class="fill" id="bar-armor"></div></div></div>
    <canvas id="minimap" width="240" height="240"></canvas>
  </div>
  <div id="bottom-right">
    <div id="speedo"><span id="speed-value">0</span><span id="speed-unit">km/h</span><div id="vehicle-name"></div></div>
    <div id="radio"><div id="radio-label">RADIO</div><div id="radio-name">Halcyon FM</div></div>
  </div>
  <div id="subtitles" class="hidden"><span id="sub-speaker"></span><span id="sub-text"></span></div>
  <div id="controls-help" class="hidden"><b>CONTROLS</b><br><kbd>W A S D</kbd> move · <kbd>Shift</kbd> run · <kbd>Space</kbd> jump<br><kbd>F</kbd> steal / leave a car · <kbd>Space</kbd> handbrake<br><kbd>Mouse</kbd> look · <kbd>Click</kbd> punch / shoot · <kbd>1-4</kbd> weapons<br><kbd>R</kbd> radio · <kbd>M</kbd> map · <kbd>Esc</kbd> pause</div>
  <div id="pointer-prompt" class="hidden">Click to control the camera</div>
  <div id="crosshair" class="hidden"></div>
  <div id="hitmarker"></div>
  <div id="arrest-bar" class="hidden">BEING ARRESTED<div id="arrest-fill"></div></div>
  <div id="banner" class="banner"><div id="banner-title"></div><div id="banner-sub"></div></div>
  <div id="damage-flash"></div>
</div>
<div id="mapscreen" class="hidden"><canvas id="map-canvas"></canvas><div id="map-side"></div></div>
<div id="menus" class="hidden"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
